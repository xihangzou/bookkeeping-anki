name: ANKI-041 final consistency fixes

on:
  push:
    paths:
      - '.github/workflows/anki041-final-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final recall-quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('production/notes/COM-01.tsv'): [
                  ('BK-COM-01-0009\t商品販売時に収益と原価を同時記録する方法では、',
                   'BK-COM-01-0009\t販売時に収益と原価を同時記録する方法では、'),
              ],
              Path('scripts/validate_fnd00_production.py'): [
                  ('"BK-FND-00-0088": "証ひょうからの仕訳判断",',
                   '"BK-FND-00-0088": "証ひょうから仕訳を判断",'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          recall = Path('scripts/validate_recall_production.py')
          text = recall.read_text(encoding='utf-8')
          anchor = '    print(f"retained_semantic_pairs_rechecked={len(semantic_pairs)}")\n'
          addition = anchor + '    print(f"severe_recall_load_defects={counts[\'recall_load\']}")\n'
          if 'severe_recall_load_defects=' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('recall validator output anchor missing or duplicated')
              text = text.replace(anchor, addition)
              recall.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'xihangzou'
          git config user.email '142606156+xihangzou@users.noreply.github.com'
          git add production/notes/COM-01.tsv scripts/validate_fnd00_production.py scripts/validate_recall_production.py
          git diff --cached --check
          git commit -m 'Resolve final ANKI-041 recall QA findings'
          git push

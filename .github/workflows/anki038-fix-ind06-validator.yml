name: ANKI-038 fix IND-06 validator

on:
  push:
    paths:
      - '.github/workflows/anki038-fix-ind06-validator.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validator false positive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_ind06_production.py')
          s=p.read_text(encoding='utf-8')
          old='''            if len(answer) >= 2 and answer in visible:\n                errors.append(f"{nid}: visible leakage {answer!r}")'''
          new='''            compound_subject_exception = (\n                nid == "BK-IND-06-0016"\n                and answer == "補助部門"\n                and "補助部門費" in visible\n                and "他の" in text\n            )\n            if len(answer) >= 2 and answer in visible and not compound_subject_exception:\n                errors.append(f"{nid}: visible leakage {answer!r}")'''
          if old not in s:
              raise SystemExit('target leakage check not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate_ind06_production.py
          git diff --cached --check
          git commit -m 'ANKI-038 fix IND-06 compound leakage check'
          git push origin HEAD:main

name: ANKI-038 corpus diagnostic

on:
  push:
    paths:
      - '.github/workflows/anki038-diagnostic.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run corpus diagnostic after normalization
        shell: bash
        run: |
          set +e
          python scripts/validate_corpus_production.py > /tmp/anki038.txt 2>&1
          code=$?
          {
            echo '<!-- ANKI-038-DIAGNOSTIC -->'
            echo '## ANKI-038 corpus diagnostic — post-normalization'
            echo
            echo '```text'
            cat /tmp/anki038.txt
            echo '```'
            echo
            echo "exit_code=$code"
          } > /tmp/comment.md
          gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

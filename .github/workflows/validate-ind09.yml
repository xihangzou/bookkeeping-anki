name: Validate IND-09 production

on:
  push:
    paths:
      - 'production/notes/IND-09.tsv'
      - 'production/qa/IND-09.md'
      - 'inventory/topic_inventory/IND-09.tsv'
      - 'scripts/validate_ind09_production.py'
      - '.github/workflows/validate-ind09.yml'
  pull_request:
    paths:
      - 'production/notes/IND-09.tsv'
      - 'production/qa/IND-09.md'
      - 'inventory/topic_inventory/IND-09.tsv'
      - 'scripts/validate_ind09_production.py'
      - '.github/workflows/validate-ind09.yml'
  workflow_dispatch:

jobs:
  validate-ind09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IND-09 production batch
        run: python scripts/validate_ind09_production.py

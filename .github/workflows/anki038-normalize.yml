name: ANKI-038 apply normalization

on:
  push:
    paths:
      - '.github/workflows/anki038-normalize.yml'

permissions:
  contents: write
  issues: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic normalization
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')

          def edit_tsv(path, edits):
              p = root / path
              with p.open(encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f, delimiter='\t')
                  fields = reader.fieldnames
                  rows = list(reader)
              by_id = {r['ID']: r for r in rows}
              for nid, fn in edits.items():
                  if nid not in by_id:
                      raise SystemExit(f'{path}: missing {nid}')
                  fn(by_id[nid])
              with p.open('w', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, delimiter='\t', lineterminator='\n')
                  w.writeheader(); w.writerows(rows)

          def deprecate(row, target, reason):
              row['Status'] = 'deprecated'
              row['Tags'] = row['Tags'].replace('status::approved', 'status::deprecated')
              suffix = f' ANKI-038: {reason} 統合先: {target}。'
              if 'ANKI-038:' not in row['Extra']:
                  row['Extra'] = row['Extra'].rstrip() + suffix

          def ind05_0023(row):
              row['ALP_IDs'] = 'ALP-IND-05-0024 ALP-IND-11-0021'
              if 'ANKI-038:' not in row['Extra']:
                  row['Extra'] = row['Extra'].rstrip() + ' ANKI-038: IND-11の同一操業度差異式をこの共通公式へ統合し、標準原価計算からも参照する。'

          edit_tsv('production/notes/IND-05.tsv', {
              'BK-IND-05-0023': ind05_0023,
          })
          edit_tsv('production/notes/IND-11.tsv', {
              'BK-IND-11-0021': lambda r: deprecate(r, 'BK-IND-05-0023', 'IND-05と生成カードの命題・式が完全一致するため、共通公式へ統合。'),
          })

          def com13_0018(row):
              row['Text'] = '報告式P/Lの利益段階は、売上総利益＝{{c1::売上高}}－{{c1::売上原価}}、営業利益＝売上総利益－{{c1::販売費及び一般管理費}}。'
              row['ALP_IDs'] = 'ALP-COM-13-0017 ALP-COM-13-0018 ALP-IND-10-0010'
              if 'ANKI-038:' not in row['Extra']:
                  row['Extra'] = row['Extra'].rstrip() + ' ANKI-038: 売上総利益と営業利益を一つの報告式P/L retrieval frameに統合し、製造業P/Lで反復していた同一利益計算もここへ集約。'

          edit_tsv('production/notes/COM-13.tsv', {
              'BK-COM-13-0017': lambda r: deprecate(r, 'BK-COM-13-0018', '売上総利益と営業利益を連続する報告式P/Lの一つのretrieval unitへ統合。'),
              'BK-COM-13-0018': com13_0018,
          })
          edit_tsv('production/notes/IND-10.tsv', {
              'BK-IND-10-0010': lambda r: deprecate(r, 'BK-COM-13-0018', '製造業でも売上総利益・営業利益の計算関係は商業簿記の報告式P/Lと同一で、製造業固有の判断を追加しないため統合。'),
          })

          def patch(path, replacements):
              p = root / path
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'{path}: patch pattern not found: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          patch('scripts/validate_ind05_production.py', [
              ('ALP_RE = re.compile(r"^ALP-IND-05-[0-9]{4}$")\nEXPECTED_IDS', 'ALP_RE = re.compile(r"^ALP-IND-05-[0-9]{4}$")\nCROSS_CHAPTER_ALPS = {"ALP-IND-11-0021"}\nEXPECTED_IDS'),
              ('"BK-IND-05-0023": ["ALP-IND-05-0024"],', '"BK-IND-05-0023": ["ALP-IND-05-0024", "ALP-IND-11-0021"],'),
              ('        for alp in alps:\n            if not ALP_RE.fullmatch(alp) or alp not in included_set:\n                errors.append(f"{nid}: invalid ALP {alp}")\n            else:\n                alp_to_notes[alp].append(nid)', '        for alp in alps:\n            if alp in included_set and ALP_RE.fullmatch(alp):\n                alp_to_notes[alp].append(nid)\n            elif alp in CROSS_CHAPTER_ALPS:\n                pass\n            else:\n                errors.append(f"{nid}: invalid ALP {alp}")'),
          ])

          patch('scripts/validate_ind11_production.py', [
              ('ALP_RE = re.compile(r"^ALP-IND-11-[0-9]{4}$")\nEXPECTED_IDS', 'ALP_RE = re.compile(r"^ALP-IND-11-[0-9]{4}$")\nDEPRECATED_IDS = {"BK-IND-11-0021"}\nEXPECTED_IDS'),
              ('        if row["Status"] != "approved" or row["QA"] != "pass":\n            errors.append(f"{nid}: lifecycle")', '        expected_status = "deprecated" if nid in DEPRECATED_IDS else "approved"\n        if row["Status"] != expected_status or row["QA"] != "pass":\n            errors.append(f"{nid}: lifecycle")\n        if nid in DEPRECATED_IDS and "統合先: BK-IND-05-0023" not in row["Extra"]:\n            errors.append(f"{nid}: missing replacement lineage")'),
              ('            f"difficulty::{row[\'Difficulty\']}", "status::approved",', '            f"difficulty::{row[\'Difficulty\']}", f"status::{expected_status}",'),
              ('    multi = sum(len(v) > 1 for v in EXPECTED_ALP_MAP.values())\n    journals = sum(r["Type"] == "journal_entry" for r in rows)\n    formulas = sum(r["Type"] == "formula" for r in rows)\n    print("IND-11 production validation: PASS")\n    print(f"notes={len(rows)} cards={len(rows)} cloze_spans={spans} included_alps={len(included)} mapped={len(included)} unmapped=0")\n    print(f"multi_alp_notes={multi} journal_entry_notes={journals} formula_notes={formulas} canonical_exclusions={len(excluded_rows)}")', '    active = [r for r in rows if r["Status"] == "approved"]\n    active_spans = sum(len(CLOZE_RE.findall(r["Text"])) for r in active)\n    multi = sum(len(v) > 1 for v in EXPECTED_ALP_MAP.values())\n    journals = sum(r["Type"] == "journal_entry" for r in active)\n    formulas = sum(r["Type"] == "formula" for r in active)\n    print("IND-11 production validation: PASS")\n    print(f"rows={len(rows)} active_notes={len(active)} deprecated_notes={len(rows)-len(active)} active_cards={len(active)} active_cloze_spans={active_spans} included_alps={len(included)}")\n    print(f"multi_alp_notes={multi} journal_entry_notes={journals} formula_notes={formulas} canonical_exclusions={len(excluded_rows)}")'),
          ])

          patch('scripts/validate_com13_production.py', [
              ('ALP_RE=re.compile(r"^ALP-COM-13-[0-9]{4}$")\nEXPECTED_IDS', 'ALP_RE=re.compile(r"^ALP-COM-13-[0-9]{4}$")\nCROSS_CHAPTER_ALPS={"ALP-IND-10-0010"}\nDEPRECATED_IDS={"BK-COM-13-0017"}\nEXPECTED_IDS'),
              ('EXPECTED_SPANS=116', 'EXPECTED_SPANS=117'),
              ("'BK-COM-13-0018':['ALP-COM-13-0018'],", "'BK-COM-13-0018':['ALP-COM-13-0017','ALP-COM-13-0018','ALP-IND-10-0010'],"),
              ("'BK-COM-13-0018':['営業利益＝{{c1::売上総利益}}－{{c1::販売費及び一般管理費}}'],", "'BK-COM-13-0018':['売上総利益＝{{c1::売上高}}－{{c1::売上原価}}','営業利益＝売上総利益－{{c1::販売費及び一般管理費}}'],"),
              ("        if row['Status']!='approved' or row['QA']!='pass': errors.append(f'{nid}: lifecycle')", "        expected_status='deprecated' if nid in DEPRECATED_IDS else 'approved'\n        if row['Status']!=expected_status or row['QA']!='pass': errors.append(f'{nid}: lifecycle')\n        if nid in DEPRECATED_IDS and '統合先: BK-COM-13-0018' not in row['Extra']: errors.append(f'{nid}: missing replacement lineage')"),
              ("tags=sorted(['bookkeeping::commercial','chapter::commercial::13',f\"difficulty::{row['Difficulty']}\",'status::approved',f\"topic::{row['Topic'].strip().replace(' ','_')}\",f\"type::{row['Type']}\"])", "tags=sorted(['bookkeeping::commercial','chapter::commercial::13',f\"difficulty::{row['Difficulty']}\",f'status::{expected_status}',f\"topic::{row['Topic'].strip().replace(' ','_')}\",f\"type::{row['Type']}\"] )"),
              ("        for alp in alps:\n            if not ALP_RE.fullmatch(alp) or alp not in included_set: errors.append(f'{nid}: invalid ALP {alp}')\n            else: alp_to_notes[alp].append(nid)", "        for alp in alps:\n            if alp in included_set and ALP_RE.fullmatch(alp):\n                if row['Status']=='approved': alp_to_notes[alp].append(nid)\n            elif alp in CROSS_CHAPTER_ALPS:\n                pass\n            else: errors.append(f'{nid}: invalid ALP {alp}')"),
              ("    multi=sum(len(v)>1 for v in EXPECTED_ALP_MAP.values())\n    journals=sum(r['Type']=='journal_entry' for r in rows); formulas=sum(r['Type']=='formula' for r in rows)\n    print('COM-13 production validation: PASS')\n    print(f'notes={len(rows)} cards={len(rows)} cloze_spans={spans} included_alps={len(included)} mapped={len(included)} unmapped=0')\n    print(f'multi_alp_notes={multi} journal_entry_notes={journals} formula_notes={formulas} canonical_exclusions={len(exc)}')", "    active=[r for r in rows if r['Status']=='approved']; active_spans=sum(len(CLOZE_RE.findall(r['Text'])) for r in active)\n    multi=sum(len(v)>1 for v in EXPECTED_ALP_MAP.values())\n    journals=sum(r['Type']=='journal_entry' for r in active); formulas=sum(r['Type']=='formula' for r in active)\n    print('COM-13 production validation: PASS')\n    print(f'rows={len(rows)} active_notes={len(active)} deprecated_notes={len(rows)-len(active)} active_cards={len(active)} active_cloze_spans={active_spans} included_alps={len(included)} mapped={len(included)} unmapped=0')\n    print(f'multi_alp_notes={multi} journal_entry_notes={journals} formula_notes={formulas} canonical_exclusions={len(exc)}')"),
          ])

          patch('scripts/validate_ind10_production.py', [
              ('ALP_RE = re.compile(r"^ALP-IND-10-[0-9]{4}$")\nEXPECTED_IDS', 'ALP_RE = re.compile(r"^ALP-IND-10-[0-9]{4}$")\nDEPRECATED_IDS = {"BK-IND-10-0010"}\nEXPECTED_IDS'),
              ('        if row["Status"] != "approved" or row["QA"] != "pass":\n            errors.append(f"{nid}: lifecycle")', '        expected_status = "deprecated" if nid in DEPRECATED_IDS else "approved"\n        if row["Status"] != expected_status or row["QA"] != "pass":\n            errors.append(f"{nid}: lifecycle")\n        if nid in DEPRECATED_IDS and "統合先: BK-COM-13-0018" not in row["Extra"]:\n            errors.append(f"{nid}: missing replacement lineage")'),
              ('            f"difficulty::{row[\'Difficulty\']}", "status::approved",', '            f"difficulty::{row[\'Difficulty\']}", f"status::{expected_status}",'),
              ('    formulas = sum(r["Type"] == "formula" for r in rows)\n    statements = sum(r["Type"] == "financial_statement" for r in rows)\n    print("IND-10 production validation: PASS")\n    print(f"notes={len(rows)} cards={len(rows)} cloze_spans={spans} included_alps={len(included)} mapped={len(included)} unmapped=0")\n    print(f"multi_alp_notes=0 journal_entry_notes=0 formula_notes={formulas} financial_statement_notes={statements} canonical_exclusions={len(excluded_rows)}")', '    active = [r for r in rows if r["Status"] == "approved"]\n    active_spans = sum(len(CLOZE_RE.findall(r["Text"])) for r in active)\n    formulas = sum(r["Type"] == "formula" for r in active)\n    statements = sum(r["Type"] == "financial_statement" for r in active)\n    print("IND-10 production validation: PASS")\n    print(f"rows={len(rows)} active_notes={len(active)} deprecated_notes={len(rows)-len(active)} active_cards={len(active)} active_cloze_spans={active_spans} included_alps={len(included)}")\n    print(f"multi_alp_notes=0 journal_entry_notes=0 formula_notes={formulas} financial_statement_notes={statements} canonical_exclusions={len(excluded_rows)}")'),
          ])
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/notes/IND-05.tsv production/notes/IND-11.tsv production/notes/COM-13.tsv production/notes/IND-10.tsv scripts/validate_ind05_production.py scripts/validate_ind11_production.py scripts/validate_com13_production.py scripts/validate_ind10_production.py
          git diff --cached --check
          git commit -m 'ANKI-038 normalize corpus duplicates'
          git push origin HEAD:main

      - name: Comment result
        if: always()
        shell: bash
        run: |
          gh issue comment 39 --repo "$GITHUB_REPOSITORY" --body 'ANKI-038 deterministic normalization workflow executed. Remaining validation is handled by the consolidated production workflow and corpus validator.'
        env:
          GH_TOKEN: ${{ github.token }}

      - 'inventory/topic_inventory/COM-05.tsv'
      - 'inventory/topic_inventory/COM-06.tsv'
      - 'inventory/topic_inventory/COM-07.tsv'
      - 'inventory/topic_inventory/COM-08.tsv'
      - 'inventory/topic_inventory/COM-09.tsv'
      - 'inventory/topic_inventory/COM-10.tsv'
      - 'inventory/topic_inventory/COM-11.tsv'
      - 'inventory/topic_inventory/IND-01.tsv'
      - 'schema/note_schema.yaml'
      - 'rules/anki_card_rules.md'
      - 'rules/cloze_rules.md'
      - 'rules/coverage_rules.md'
      - 'rules/exam_yield_rules.md'
      - 'rules/recall_precision_rules.md'
      - 'scripts/migrate_living_spec_governance.py'
      - 'scripts/validate_governance.py'
      - 'scripts/migrate_fnd00_v1_2.py'
      - 'scripts/migrate_fnd00_v1_3.py'
      - 'scripts/migrate_fnd00_v1_4.py'
      - 'scripts/migrate_fnd00_v1_5.py'
      - 'scripts/migrate_fnd00_v1_6.py'
      - 'scripts/validate_fnd00_production.py'
      - 'scripts/validate_com01_production.py'
      - 'scripts/validate_com02_production.py'
      - 'scripts/validate_com03_production.py'
      - 'scripts/validate_com04_production.py'
      - 'scripts/validate_com05_production.py'
      - 'scripts/validate_com06_production.py'
      - 'scripts/validate_com07_production.py'
      - 'scripts/validate_com08_production.py'
      - 'scripts/validate_com09_production.py'
      - 'scripts/validate_com10_production.py'
      - 'scripts/validate_com11_production.py'
      - 'scripts/validate_ind01_production.py'
      - 'TASKS.md'
      - '.github/workflows/validate-production.yml'
  pull_request:
    paths:
      - 'GOVERNANCE.md'
      - 'README.md'
      - 'SPEC.md'
      - 'FREEZE.md'
      - 'production/notes/**'
      - 'production/qa/**'
      - 'production/README.md'
      - 'inventory/topic_inventory/FND-00.tsv'
      - 'inventory/topic_inventory/COM-01.tsv'
      - 'inventory/topic_inventory/COM-02.tsv'
      - 'inventory/topic_inventory/COM-03.tsv'
      - 'inventory/topic_inventory/COM-04.tsv'
      - 'inventory/topic_inventory/COM-05.tsv'
      - 'inventory/topic_inventory/COM-06.tsv'
      - 'inventory/topic_inventory/COM-07.tsv'
      - 'inventory/topic_inventory/COM-08.tsv'
      - 'inventory/topic_inventory/COM-09.tsv'
      - 'inventory/topic_inventory/COM-10.tsv'
      - 'inventory/topic_inventory/COM-11.tsv'
      - 'inventory/topic_inventory/IND-01.tsv'
      - 'schema/note_schema.yaml'
      - 'rules/anki_card_rules.md'
      - 'rules/cloze_rules.md'
      - 'rules/coverage_rules.md'
      - 'rules/exam_yield_rules.md'
      - 'rules/recall_precision_rules.md'
      - 'scripts/migrate_living_spec_governance.py'
      - 'scripts/validate_governance.py'
      - 'scripts/migrate_fnd00_v1_2.py'
      - 'scripts/migrate_fnd00_v1_3.py'
      - 'scripts/migrate_fnd00_v1_4.py'
      - 'scripts/migrate_fnd00_v1_5.py'
      - 'scripts/migrate_fnd00_v1_6.py'
      - 'scripts/validate_fnd00_production.py'
      - 'scripts/validate_com01_production.py'
      - 'scripts/validate_com02_production.py'
      - 'scripts/validate_com03_production.py'
      - 'scripts/validate_com04_production.py'
      - 'scripts/validate_com05_production.py'
      - 'scripts/validate_com06_production.py'
      - 'scripts/validate_com07_production.py'
      - 'scripts/validate_com08_production.py'
      - 'scripts/validate_com09_production.py'
      - 'scripts/validate_com10_production.py'
      - 'scripts/validate_com11_production.py'
      - 'scripts/validate_ind01_production.py'
      - 'TASKS.md'
      - '.github/workflows/validate-production.yml'
  workflow_dispatch:

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate living-spec governance
        run: python scripts/validate_governance.py

  validate-fnd00:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate FND-00 production batch
        run: python scripts/validate_fnd00_production.py

  validate-com01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

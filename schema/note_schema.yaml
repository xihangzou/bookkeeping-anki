version: 1.1
model: Cloze
source_of_truth: repository_text

governance:
  policy: living_spec
  authority: latest_merged
  governance_document: GOVERNANCE.md
  historical_baseline: v1.0_pilot_gate

lifecycle:
  phase: production
  revision_gate: reviewed_change

source:
  repository: xihangzou/bookkeeping-integrated
  path: merged/textbook.md
  baseline_commit: 569ed7b82e729334e1472286eaca7c4352e6fbdb

ordering:
  canonical_source_order:
    part:
      - foundation
      - commercial
      - industrial
    chapter: numeric_ascending
    alp_sequence: numeric_ascending

source_mapping:
  exact_mapping_index: inventory/topic_inventory.yaml
  exact_mapping_dataset: inventory/topic_inventory/*.tsv
  note_mapping_key: ALP_IDs
  denormalized_query_fields:
    - Part
    - Chapter
    - Section
    - Topic
  rules:
    - Each ALP_ID must resolve to exactly one included ALP in the canonical topic inventory.
    - Exact source anchors are recovered through the mapped ALP records rather than duplicated in every Note row.
    - A Note may map multiple ALPs only when they form one coherent recall unit; every mapped ALP remains independently source-traceable through the inventory.
    - ALP_IDs are serialized in canonical_source_order.
    - For a multi-ALP Note, Part, Chapter, and Section must match the first mapped ALP in canonical_source_order; this is the deterministic primary source context.
    - Topic is the normalized accounting topic label for the coherent recall unit and remains a Note-level query field.
    - If mapped ALPs span more than one source location, ALP_IDs remain the authority for complete source mapping; the denormalized Part, Chapter, and Section fields are only the deterministic primary context.

id_format:
  note: BK-{part_code}-{chapter_2d}-{sequence_4d}
  alp: ALP-{part_code}-{chapter_2d}-{sequence_4d}
  part_codes:
    foundation: FND
    commercial: COM
    industrial: IND
  chapter:
    format: two_digit_decimal
    foundation: "00"
    commercial: source_chapter_number
    industrial: source_chapter_number
  sequence:
    format: four_digit_decimal
    scope: part_and_chapter
    assignment: next_unused_integer
    immutable_after_assignment: true
    reuse_deleted_identifier: false
  examples:
    - BK-FND-00-0001
    - BK-COM-01-0001
    - BK-IND-01-0001
    - ALP-FND-00-0001
    - ALP-COM-01-0001
    - ALP-IND-01-0001

fields:
  - name: ID
    required: true
    unique: true
    description: Stable Note identifier derived from Part, Chapter, and an immutable chapter-local sequence.

  - name: Text
    required: true
    description: Canonical Anki Cloze text containing one coherent recall unit.

  - name: Extra
    required: false
    description: Explanation, derivation, journal-entry reasoning, common error, related source note, or limited CPA bridge.

  - name: SourceRepo
    required: true
    default: xihangzou/bookkeeping-integrated

  - name: SourceCommit
    required: true
    default: 569ed7b82e729334e1472286eaca7c4352e6fbdb

  - name: SourcePath
    required: true
    default: merged/textbook.md

  - name: Part
    required: true
    allowed:
      - foundation
      - commercial
      - industrial

  - name: Chapter
    required: true
    description: Canonical chapter number and title from textbook.md; the leading chapter number determines chapter_2d.

  - name: Section
    required: true
    description: Most specific useful heading path for the Note's deterministic primary source context.

  - name: Topic
    required: true
    description: Normalized accounting topic label for the coherent recall unit.

  - name: Type
    required: true
    allowed:
      - definition
      - classification
      - recognition
      - measurement
      - journal_entry
      - formula
      - procedure
      - comparison
      - exception
      - reasoning
      - ledger
      - financial_statement
      - cost_accounting

  - name: ALP_IDs
    required: true
    description: One or more canonical included ALP IDs mapped to this Note.
    serialization:
      delimiter: space
      unique_items: true
      order: canonical_source_order

  - name: Difficulty
    required: true
    allowed:
      - 1
      - 2
      - 3
      - 4
      - 5

  - name: Tags
    required: true
    description: Space-separated normalized Anki tags derived from canonical Note fields plus optional secondary characteristics.
    serialization:
      delimiter: space
      unique_items: true
      order: lexical

  - name: Status
    required: true
    allowed:
      - draft
      - pilot
      - approved
      - deprecated

  - name: QA
    required: true
    allowed:
      - pending
      - pass
      - fail

cloze_constraints:
  default_min_groups: 1
  default_max_groups: 3
  allow_more_when:
    - ordered_procedure
    - financial_statement_structure
    - inseparable_multi_part_rule
    - justified_comparison

canonical_tag_namespaces:
  - bookkeeping::foundation
  - bookkeeping::commercial
  - bookkeeping::industrial
  - chapter::foundation::<nn>
  - chapter::commercial::<nn>
  - chapter::industrial::<nn>
  - type::<type>
  - topic::<normalized_topic>
  - difficulty::<1-5>
  - status::<draft|pilot|approved|deprecated>
  - secondary::<normalized_characteristic>

tag_contract:
  delimiter: space
  required_tags:
    - bookkeeping::<Part>
    - chapter::<Part>::<chapter_2d>
    - type::<Type>
    - topic::<normalized_topic>
    - difficulty::<Difficulty>
    - status::<Status>
  field_mapping:
    bookkeeping_part:
      foundation: bookkeeping::foundation
      commercial: bookkeeping::commercial
      industrial: bookkeeping::industrial
    chapter:
      format: chapter::<Part>::<chapter_2d>
    type:
      format: type::<Type>
    difficulty:
      format: difficulty::<Difficulty>
    status:
      format: status::<Status>
  topic_normalization:
    source: Topic
    trim_outer_whitespace: true
    replace_internal_whitespace_with: _
    forbid_substring: "::"
    preserve_non_latin_characters: true
    nonempty: true
  optional_secondary_tags:
    namespace: secondary
    format: secondary::<normalized_characteristic>
    normalization: same_as_topic_normalization
  rules:
    - Required tags are derived mechanically from the corresponding Note fields.
    - Exactly one required tag from each required namespace must be present.
    - Optional secondary tags may describe secondary characteristics but must not replace the primary Type.
    - Tags contain no literal whitespace; spaces separate tags.

row_validation:
  - ID must be unique and match ^BK-(FND|COM|IND)-[0-9]{2}-[0-9]{4}$.
  - The ID part token must match Part through id_format.part_codes.
  - The ID chapter token must match the canonical two-digit chapter number derived from Chapter.
  - Once assigned, an ID must not be renumbered, reused, or changed because another Note is inserted or deleted.
  - Text must contain at least one valid {{cN::...}} expression.
  - ALP_IDs must contain at least one unique ID matching ^ALP-(FND|COM|IND)-[0-9]{2}-[0-9]{4}$, serialized with one ASCII space, in canonical_source_order.
  - Every ALP_ID must exist as an included ALP in the canonical topic inventory.
  - Exact source traceability must be recoverable for every mapped ALP through the canonical topic inventory.
  - Part, Chapter, and Section must match the first mapped ALP in canonical_source_order.
  - SourceRepo, SourceCommit, and SourcePath must match the batch's pinned source baseline unless an explicit reviewed source-baseline migration updates them.
  - Topic and Type must be nonempty and use canonical values.
  - Required Tags must be present exactly once, match their source fields, and use normalized namespaces.
  - Tags must be unique and lexically ordered after deterministic normalization.
  - If mapped ALPs have secondary characteristics worth querying, represent them with secondary::<normalized_characteristic> tags rather than ad-hoc Type values.
  - Every approved Note must have QA=pass.
  - Every approved Note must contain complete source traceability through its pinned source fields and ALP mappings.
  - Extra must not contain the only copy of a required recall answer.

export:
  canonical_format: tsv
  encoding: utf-8
  field_order:
    - ID
    - Text
    - Extra
    - SourceRepo
    - SourceCommit
    - SourcePath
    - Part
    - Chapter
    - Section
    - Topic
    - Type
    - ALP_IDs
    - Difficulty
    - Tags
    - Status
    - QA
  physical_row_policy: one_note_per_line
  field_delimiter: tab
  row_delimiter: lf
  escaping:
    backslash: "\\\\"
    tab: "\\t"
    carriage_return: "\\r"
    line_feed: "\\n"
    order:
      - backslash
      - tab
      - carriage_return
      - line_feed
  list_fields:
    ALP_IDs:
      delimiter: space
      order: canonical_source_order
      unique_items: true
    Tags:
      delimiter: space
      order: lexical
      unique_items: true
  anki_model: Cloze
  deck_name: Bookkeeping Master
  apkg_is_source_of_truth: false
